name: Desktop packages
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundle: nsis
          - os: macos-15-intel
            platform: macos-x64
            bundle: dmg
          - os: macos-15
            platform: macos-arm64
            bundle: dmg
          - os: ubuntu-22.04
            platform: linux-x64
            bundle: appimage
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      ARTIFACT_PLATFORM: ${{ matrix.platform }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libx11-dev libxtst-dev libxrandr-dev libxinerama-dev libxcursor-dev libxfixes-dev libfuse2 xclip
      - name: Install Windows C compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Windows C compiler
        if: runner.os == 'Windows'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$MSYS2_LOCATION/ucrt64/bin" >> "$GITHUB_PATH"
          echo "CC=$MSYS2_LOCATION/ucrt64/bin/gcc.exe" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Version tests
        working-directory: desktop
        run: npm test
      - name: Build bundled Go client
        working-directory: desktop
        run: npm run prepare:sidecar
      - name: Go tests
        run: go test ./... -count=1 -timeout 120s
      - name: Client connection smoke test
        working-directory: desktop
        run: node scripts/smoke.mjs
      - name: Frontend build
        working-directory: desktop
        run: npm run build
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked --lib
      - name: Package native installer
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - name: Verify and collect installer
        working-directory: desktop
        run: node scripts/collect.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ChickReomte-${{ matrix.platform }}
          path: desktop/artifacts/*
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ChickReomte-*
          path: release
          merge-multiple: true
      - name: Verify all installers and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cd release
          test -f "ChickReomte_${version}_windows-x64.exe"
          test -f "ChickReomte_${version}_macos-x64.dmg"
          test -f "ChickReomte_${version}_macos-arm64.dmg"
          test -f "ChickReomte_${version}_linux-x64.AppImage"
          cat *.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "ChickReomte $TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$TAG" release/*.exe release/*.dmg release/*.AppImage release/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
