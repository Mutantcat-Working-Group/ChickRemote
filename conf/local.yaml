id: local              # 客户端ID
server: 127.0.0.1:6154 # 服务器地址
ssl:
  enabled: false       # 是否使用tls连接
  insecure: false      # true会跳过证书校验；生产保持false，私有CA应加入系统信任库
dashboard: # web面板
  enabled: true   # 是否开放dashboard
  listen: 0.0.0.0 # 示例监听所有网卡；无独立登录认证，建议改为127.0.0.1
  port: 8080      # 监听端口号
#include common.yaml
rules: # rule列表
  #include rule.d/*.yaml
